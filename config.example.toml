# Copy to ~/.config/pane/config.toml. Every key is optional.

# Seconds between refreshes. Minimum 15.
refresh_secs = 90

# squash, merge or rebase.
merge_method = "squash"

# Show every open PR and issue in these organizations.
orgs = ["my-org"]

# Show these repositories in addition to the orgs above.
repos = ["octocat/hello-world"]

# With both lists empty, pane shows items that involve you.

# The Claude action (press r on a PR). The prompt can be edited before each run.
claude_prompt = "Rebase this PR on its base branch and fix any failing checks."

# Extra arguments passed to `claude`. `claude -p` cannot ask for approval, so the default
# uses auto mode, which approves routine actions on its own. Use [] to rely only on your
# own Claude settings, or "acceptEdits" to allow file edits only.
claude_args = ["--permission-mode", "auto"]

# Run each job in its own git worktree so your checkout is untouched.
claude_worktree = true

# Directories searched for local clones of the repos you act on.
repo_roots = ["~/code", "~/src"]
